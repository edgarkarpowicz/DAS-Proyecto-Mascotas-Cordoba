# ==============================================================================
# Docker Compose - Infraestructura Auxiliar (Mascotas Córdoba - DAS UBP)
#
# El Backend municipal (Spring Boot, :8080) y el Frontend (Angular, :4200) se
# ejecutan localmente por consola en el host.
# Este Compose provee SQL Server local opcional (1433) y reserva la red/puertos
# para levantar en contenedores los sistemas externos de Veterinarias (RF06/RF09).
# ==============================================================================
services:
  # SQL Server 2022 opcional con inicialización automática de das-mascotas-cordoba
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mascotas-db
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD en .env.local}
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - mascotas_sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q 'SELECT 1' -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: "no"
    entrypoint: ["/bin/bash", "/scripts/init-db-local.sh"]
    environment:
      SQLCMDPASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD en .env.local}
    volumes:
      - ./scripts/init-db-local.sh:/scripts/init-db-local.sh:ro
      - ./db:/scripts/db:ro
    depends_on:
      sqlserver:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # Sistemas externos simulados: Veterinarias adheridas (RF06 / RF09)
  #   - Vet 1 (San Antonio Vet - REST):               http://localhost:8081/api/veterinaria
  #   - Vet 2 (Veterinaria Central Córdoba - SOAP):   http://localhost:8082/services/VeterinariaSoapService
  #   - Vet 3 (Clínica Vet Alta Córdoba - REST):      http://localhost:8083/api/v1/integracion (no levantada para validar RNF06)
  # ----------------------------------------------------------------------------
  vet-san-antonio:
    build:
      context: ./veterinarias-externas/veterinaria-service
    container_name: mascotas-vet-san-antonio
    restart: unless-stopped
    environment:
      SERVER_PORT: "8081"
      CLINIC_PROFILE: "san-antonio"
    ports:
      - "127.0.0.1:8081:8081"

  vet-central-soap:
    build:
      context: ./veterinarias-externas/veterinaria-service
    container_name: mascotas-vet-central-soap
    restart: unless-stopped
    environment:
      SERVER_PORT: "8082"
      CLINIC_PROFILE: "central-soap"
    ports:
      - "127.0.0.1:8082:8082"

volumes:
  mascotas_sqlserver_data:
