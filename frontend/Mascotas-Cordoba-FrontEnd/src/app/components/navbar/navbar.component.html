<header class="navbar">
  <div class="navbar-container">
    
    <!-- Brand / Logo -->
    <a routerLink="/publicaciones" class="brand-link">
      <div class="brand-badge">
        <svg class="brand-heart" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
      </div>
      <span class="brand-text">Mascotas Córdoba</span>
    </a>

    <!-- Nav Links & Profile -->
    <nav class="nav-actions">
      
      <!-- Publicaciones Item -->
      <a routerLink="/publicaciones" class="nav-item active">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
        </svg>
        <span>Publicaciones</span>
      </a>

      <!-- User Profile Dropdown -->
      <div class="user-menu-container">
        <button type="button" class="user-btn" (click)="toggleDropdown()">
          <svg class="user-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
          <span class="user-cuil">CUIL: {{ currentUser()?.cuil || '27-12345678-9' }}</span>
          <svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
          </svg>
        </button>

        @if (showDropdown) {
          <div class="dropdown-menu">
            <div class="dropdown-header">
              <p class="dropdown-name">{{ currentUser()?.nombre }} {{ currentUser()?.apellido }}</p>
              <p class="dropdown-refugio">{{ currentUser()?.nombreRefugio }}</p>
            </div>
            <hr class="dropdown-divider" />
            <button class="dropdown-item logout-btn" (click)="logout()">
              <svg class="dropdown-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
              </svg>
              <span>Cerrar sesión</span>
            </button>
          </div>
        }
      </div>

    </nav>

  </div>
</header>
