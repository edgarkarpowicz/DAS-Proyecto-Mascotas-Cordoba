@if (message(); as msg) {
  <div class="modal-backdrop" (click)="close()">
    <div class="modal-card" (click)="$event.stopPropagation()">
      
      <div class="modal-header" [class.is-error]="msg.type === 'error'" [class.is-warning]="msg.type === 'warning'">
        <div class="header-content">
          <div class="icon-circle">
            @if (msg.type === 'error') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <circle cx="12" cy="12" r="10" />
                <line x1="12" y1="8" x2="12" y2="12" />
                <line x1="12" y1="16" x2="12.01" y2="16" />
              </svg>
            } @else if (msg.type === 'warning') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
              </svg>
            } @else {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <circle cx="12" cy="12" r="10" />
                <line x1="12" y1="16" x2="12" y2="12" />
                <line x1="12" y1="8" x2="12.01" y2="8" />
              </svg>
            }
          </div>
          <div>
            <h3 class="modal-title">{{ msg.title || 'Aviso del Sistema' }}</h3>
            @if (msg.num !== undefined && msg.num !== null) {
              <span class="status-chip">Código: {{ msg.num }}</span>
            }
          </div>
        </div>

        <button type="button" class="close-btn" (click)="close()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <div class="modal-body">
        <p class="modal-text">{{ msg.text }}</p>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-primary" (click)="close()">Entendido</button>
      </div>

    </div>
  </div>
}
