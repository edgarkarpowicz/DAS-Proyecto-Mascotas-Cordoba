<div role="dialog" aria-modal="true" [attr.aria-label]="'Vista completa de ' + altText">
  <button type="button" class="lightbox-close-btn" (click)="cerrar()" aria-label="Cerrar vista ampliada"
    title="Cerrar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
    </svg>
  </button>

  <figure class="lightbox-figure">
    <img [src]="data.imageUrl" (error)="onImageError($event)" [alt]="altText" class="lightbox-image" />
    @if (data.caption) {
      <figcaption class="lightbox-caption">{{ data.caption }}</figcaption>
    }
  </figure>
</div>
